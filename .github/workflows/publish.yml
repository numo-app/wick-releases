name: Publish a Wick version

# A new version is pushed into pending/ (installer, its .sig and latest.json, built and signed
# elsewhere). This publishes them as a GitHub release, where installed copies of Wick look for
# updates (releases/latest/download/latest.json), and then empties pending/.
on:
  push:
    branches: [main]
    paths: ["pending/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f pending/latest.json ] || { echo "Nothing pending."; exit 0; }
          version=$(jq -r .version pending/latest.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Bad version: $version"; exit 1; }
          notes=$(jq -r '.notes // "Wick for Windows."' pending/latest.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" pending/* --clobber
          else
            gh release create "v$version" pending/* --title "Wick $version" \
              --notes "$notes

          Download **Wick_${version}_x64-setup.exe** and run it. Installed copies update themselves."
          fi
      - name: Empty pending/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -rq pending
          git commit -qm "Published $(date -u +%Y-%m-%d)"
          git push
